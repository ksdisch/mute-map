# Runs every offline test suite (test_*.py) on push to main and on PRs.
# The suites need no API key and make no paid calls — that's by design;
# they gate everything that does spend (see README "How to re-run").
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.0  # no floating v8 major tag exists
        with:
          enable-cache: true
      # `uv run <file>` executes the module as a plain script. The suites are
      # bare `def test_*` collections with no `__main__` entrypoint, so that
      # form imported each file and exited 0 without running a single
      # assertion — CI passed vacuously from fdcbfcc until PR #13's review
      # caught it. pytest must be the thing invoked, per file so the
      # per-suite log grouping still works.
      - name: Run all offline test suites
        run: |
          rc=0
          for f in test_*.py; do
            echo "::group::$f"
            if ! uv run pytest -q "$f"; then
              echo "FAILED: $f"
              rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc
